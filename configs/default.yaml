# Single source of truth for the study. Anything that changes a reported number lives here.
# Values marked TODO are filled in by scripts/stage_assets.py (writes configs/pinned.json)
# or chosen by the team before the full runs.

paths:
  raw: data/raw              # parquet snapshots written by stage_assets.py
  splits: data/splits        # frozen item-ID lists (commit these)
  results: results           # per-item tables, one folder per run
  frontier_cache: results/frontier_cache.sqlite

datasets:
  medmcqa:
    hf_id: openlifescienceai/medmcqa
  medqa:
    hf_id: GBaker/MedQA-USMLE-4-options

small_model:
  hf_id: Qwen/Qwen3-8B
  revision: null             # TODO: pinned commit hash, recorded in configs/pinned.json
  enable_thinking: false

frontier:
  provider: null             # TODO: "anthropic" or "openai"
  model: null                # TODO: exact model string; record access date in pinned.json
  # Opus/Sonnet 5.5 reason before answering and reasoning tokens count toward this cap.
  # 16 would cut the model off before it writes a letter; 'fail' parses flag truncations.
  max_output_tokens: 4000
  temperature: null          # omitted from the request; may be rejected while thinking is on

splits:
  seed: 20261018
  # How duplicates are detected. "question_options" = normalized stem + sorted normalized
  # options (catches option-shuffled copies, keeps generic stems like "All are true EXCEPT"
  # that appear with different options). "question" = stem only, as the proposal words it.
  dedup_key: question_options
  calibration_size: 1500     # stratified by subject from deduplicated MedMCQA validation
  ft_train_size: 30000
  ft_dev_size: 1000
  pilot_size: 200            # drawn from the calibration split

prompt:
  version: v1                # bump when the template text changes; it is part of every cache key

finetune:                    # QLoRA, proposal section 5.2; held fixed across the three seeds
  seeds: [1, 2, 3]
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  epochs: 2
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  per_device_batch_size: 16
  grad_accum: 2              # effective batch 32 -> ~938 steps per epoch on 30k items
  eval_every_steps: 100      # ft_dev loss; used only to watch for overfitting
  max_grad_norm: 1.0
  output_dir: checkpoints

permutations:
  k: 9                       # nine non-identity orders + the original = ten presentations
  seed: 20261018
